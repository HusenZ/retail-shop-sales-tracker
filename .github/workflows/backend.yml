name: backend

on:
  push:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
          POSTGRES_DB: shop_tracker
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://shop:shop@localhost:5432/shop_tracker
      TEST_DATABASE_URL: postgresql+asyncpg://shop:shop@localhost:5432/shop_tracker_test
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: PGPASSWORD=shop psql -h localhost -U shop -d shop_tracker -f scripts/create-test-db.sql
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - name: Migrations apply and match the models
        run: alembic upgrade head && alembic check
      - run: pytest -q
